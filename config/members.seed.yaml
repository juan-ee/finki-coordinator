# Bootstrap roster - imported ONCE by `scripts/init_db.py --seed` on first boot
# (marker: `seeded_at` in the settings table). After that the DB is authoritative
# and this file is documentation only (proposal §1, §8.1 step 7).
#
# telegram_id is optional: null = the member has not onboarded yet (their Telegram
# user ID is set later via member_update once they have messaged the bot). Wake
# times are LOCAL to each member's timezone; the coordinator computes the UTC
# cron schedules (never put a UTC time here).
- name: Juan
  telegram_id: null
  timezone: Europe/Berlin
  wake: "06:30"
  role: Founder
- name: Jose
  telegram_id: null
  timezone: America/Guayaquil
  wake: "06:00"
  role: Founder
- name: Luis
  telegram_id: null
  timezone: America/Guayaquil
  wake: "05:30"
  role: Founder
- name: David
  telegram_id: null
  timezone: America/Guayaquil
  wake: "11:00"
  role: Founder
