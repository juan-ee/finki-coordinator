# docker-compose.yml — Hermes coordinator template.
#
# Builds NousResearch/hermes-agent from source at the commit pinned in
# docker/HERMES_REF. The pinned ref MUST stay literally in the build URL below —
# tests/test_compose.py fails if the pin file and this file drift apart. Update
# BOTH together, then rebuild (procedure: docker/README.md).
#
# Secrets are never written here: every credential is a bare list-form
# environment entry passed through from the runtime environment (fill .env from
# .env.example; never commit it). docker compose config exits 0 with no .env
# present — unset entries render as null, no values.

services:
  gateway:
    # Git-URL build context at the pinned ref (docker/HERMES_REF — keep in sync).
    build: https://github.com/NousResearch/hermes-agent.git#29112bef099274229cadff79cdff7bf7b99c4b77
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    # Host networking per upstream compose (proposal §5): the gateway long-polls
    # Telegram, so no inbound ports are needed or published.
    network_mode: host
    volumes:
      # Hermes home (config.yaml, SOUL.md, profiles, sessions, cron state).
      # setup.sh writes the host side at ${HERMES_HOME:-$HOME/.hermes}; inside the
      # container the upstream image sets HERMES_HOME=/opt/data.
      - ~/.hermes:/opt/data
      # Coordinator plugin, mounted read-only into the user-plugin directory
      # (upstream: user plugins live under <HERMES_HOME>/plugins/).
      - ./src/coordinator:/opt/data/plugins/coordinator:ro
      # Our runtime state: data/hermes/hermes-coord.db (plugin DB) and data/project/
      # (the agent workspace — AGENTS.md, docs/ = the knowledge record, journal/,
      # inbox/). Gitignored — never commit; compose config stays valid while data/
      # does not exist yet.
      - ./data:/opt/data/workspace
    environment:
      # Timezone law (AGENTS.md #4): the whole container is anchored to UTC —
      # Hermes computes every cron schedule in this single zone; per-member
      # conversions happen inside the coordinator plugin, never per-job.
      - TZ=UTC
      # s6 drops privileges to this uid/gid so files it creates in the bind
      # mounts stay owned by the host user. Upstream defaults to 10000 — on the
      # Pi set HERMES_UID / HERMES_GID in .env to your own `id -u` / `id -g`.
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # T2.26 evaluation (exec-user guard): the exec user CANNOT be pinned at the
      # compose level — the compose spec has no exec-user key (exec inherits the
      # container's user; root here, because the upstream s6 entrypoint must start
      # as root to drop to HERMES_UID/GID), and a service-level `user:` would break
      # that privilege drop. The guard is documentation instead: setup.sh step 8/8
      # prints `docker compose exec --user <runtime uid> …` for every token-writing
      # command (OAuth, checks, the gws CLI — all token refresh writes).
      # Secrets & credentials — bare list form: values flow from the runtime
      # environment (sourced .env), never rendered into this file or its config.
      - TELEGRAM_BOT_TOKEN
      # the DM door: extended by scripts/allow.sh (operator-run; applies via up -d,
      # never restart — restart reuses the env frozen at container creation).
      - TELEGRAM_ALLOWED_USERS
      - TELEGRAM_GROUP_ALLOWED_CHATS
      - TELEGRAM_GROUP_ALLOWED_USERS
      - OPENROUTER_API_KEY
      # Dashboard exposure (T2.31): Hermes' built-in dashboard with its fail-closed
      # basic-auth gate (proposal §12). Bare passthrough — values live in .env only.
      - HERMES_DASHBOARD
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      # No Drive/rclone variables (v6/v7): the agent reaches Drive through Hermes'
      # built-in google-workspace skill ($GAPI) — agent-driven setup, skill-managed
      # credential, nothing Drive-related passes through compose.
    # Gateway command per upstream compose.
    command: ["gateway", "run"]

  # v7 (T2.30): the static knowledge site — caddy serves the rendered record
  # (data/site, rebuilt by make site-build / the host crontab line) on host loopback
  # only. Exposure beyond the Pi happens through the cloudflared tunnel (T2.31),
  # never a published port.
  caddy:
    image: caddy:2
    container_name: hermes-docs-site
    restart: unless-stopped
    volumes:
      # The rendered site (output of make site-build), served read-only.
      - ./data/site:/usr/share/caddy:ro
    ports:
      # Loopback bind only: the site is reachable on the Pi itself at :8080; the
      # tunnel is the only path to it from outside.
      - "127.0.0.1:8080:80"

  # v7 (T2.31): the outbound-only Cloudflare Tunnel. cloudflared dials Cloudflare's
  # edge — NO inbound ports, ever (proposal §5/§12). Host networking (same shape as
  # the gateway) lets the tunnel reach BOTH loopback services directly: the public
  # hostnames configured in the Cloudflare dashboard map kb.* → http://127.0.0.1:8080
  # (caddy) and board.* → http://127.0.0.1:9119 (the dashboard, loopback-bound per
  # §12 — a bridge-network tunnel with the host-gateway alias could NOT reach a
  # loopback-bound socket, review finding T2.31). Remotely managed: the token comes
  # from .env (CLOUDFLARE_TUNNEL_TOKEN); no tunnel config lives in files. Access
  # (Google SSO, team only) gates both hostnames at the edge; the dashboard's
  # basic-auth gate stays on as the second layer.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hermes-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      # Interpolated from the runtime environment (.env); renders empty offline.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
