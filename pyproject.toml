# Hermes coordinator template — package + dev tooling.
# uv is THE package manager: uv.lock is committed and authoritative (AGENTS.md).
[project]
name = "coordinator"
version = "0.1.0"
description = "Async project coordinator plugin for hermes-agent (Hermes coordinator template)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Markdown prose (AGENTS.md contract snippets, ROADMAP examples) is not ruff's business.
extend-exclude = ["*.md"]

[tool.mypy]
strict = true
